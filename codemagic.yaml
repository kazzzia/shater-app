# ═══════════════════════════════════════════════════════════════════════════
# شاطر — بناء iOS سحابيًا ورفعه TestFlight (بلا جهاز ماك)
#
# ⚠️ نسخة ٢ — التوقيع المُدار (ios_signing):
# النسخة الأولى نسخت طريقة رويا اليدوية (keychain + fetch-signing-files)
# وتحتاج لصق CERTIFICATE_PRIVATE_KEY في واجهة كودماجيك — وتعثّرت مرتين
# لأن السر لا يصل. التوقيع المُدار يجعل كودماجيك ينشئ الشهادات والملفات
# بنفسه من ربط App Store Connect الموجود — **صفر أسرار تُلصق يدويًا**.
#
# يبقى المطلوب الوحيد من الواجهة: integration «ROYA ASC Key» (موجود من رويا
# ويخدم كل تطبيقات الحساب).
#
# درس رويا الباقي: رقم الإصدار من pubspec.yaml — لا يُثبَّت هنا أبدًا.
# ═══════════════════════════════════════════════════════════════════════════
workflows:
  ios-release:
    name: SHATER iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.shater.app
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: ROYA ASC Key
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: تشخيص التوقيع — اقرأ هذا القسم من السجل
        script: |
          echo "════════ تشخيص التوقيع ════════"
          echo "— شهادات التوزيع الموجودة في حساب آبل:"
          app-store-connect certificates list --type IOS_DISTRIBUTION 2>&1 | head -40 || true
          app-store-connect certificates list --type DISTRIBUTION 2>&1 | head -40 || true
          echo "— المعرفات المسجلة المطابقة:"
          app-store-connect bundle-ids list --bundle-id-identifier com.shater.app 2>&1 | head -20 || true
          echo "— ملفات التوقيع التي جلبها النظام المُدار:"
          ls -la ~/Library/MobileDevice/"Provisioning Profiles"/ 2>/dev/null || echo "  (لا شيء)"
          ls -la ~/Library/MobileDevice/Certificates/ 2>/dev/null || echo "  (لا شهادات)"
          echo "════════ نهاية التشخيص ════════"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # بلا إرسال لمراجعة خارجية — يوصل الاختبار الداخلي فورًا
        # (قرار رويا ٣١ يوليو: فارس يختبر بنفسه)
