# ═══════════════════════════════════════════════════════════════════════════
# شاطر — بناء iOS سحابيًا ورفعه TestFlight (بلا جهاز ماك)
#
# ⚠️ نسخة ٣ — العودة لطريقة رويا اليدوية المجرَّبة على هذا الحساب نفسه:
# جرّبنا التوقيع «المُدار» (ios_signing) فتبيّن أنه لا ينشئ ملف توقيع
# لمعرّف جديد ويفشل قبل أول خطوة. التشخيص الحي أكّد: شهادة توزيع واحدة
# فقط بالحساب (فيه مكان لثانية)، والمعرّف مسجّل، والناقص ملف توقيع شاطر —
# وfetch-signing-files --create ينشئه أكيد (هي التي بنت رويا للمتجر).
#
# المطلوب من الواجهة مرة واحدة:
#   مجموعة appstore فيها CERTIFICATE_PRIVATE_KEY (مفتاح إنشاء الشهادة)
#   وخطوة «فحص المفتاح» توقف مبكرًا برسالة عربية إن لم يصل.
#
# درس رويا الباقي: رقم الإصدار من pubspec.yaml — لا يُثبَّت هنا أبدًا.
# ═══════════════════════════════════════════════════════════════════════════
workflows:
  # ═══ مسار تشخيص فقط — بلا توقيع فلا يموت قبل البداية ═══
  diagnose:
    name: تشخيص فقط — لا بناء
    instance_type: mac_mini_m2
    max_build_duration: 10
    integrations:
      app_store_connect: ROYA ASC Key
    scripts:
      - name: اسأل آبل عن الشهادات والمعرفات
        script: |
          echo "════════ تشخيص ════════"
          echo "— شهادات Apple Distribution:"
          app-store-connect certificates list --type DISTRIBUTION 2>&1 | head -60 || true
          echo "— المعرف com.shater.app:"
          app-store-connect bundle-ids list --bundle-id-identifier com.shater.app 2>&1 | head -25 || true
          echo "— ملفات التوقيع الموجودة:"
          app-store-connect profiles list 2>&1 | head -80 || true
          echo "════════ نهاية التشخيص ════════"

  ios-release:
    name: SHATER iOS Release
    instance_type: mac_mini_m2
    max_build_duration: 45
    environment:
      groups:
        - appstore   # فيها CERTIFICATE_PRIVATE_KEY — تُضاف مرة من الواجهة
      flutter: stable
      xcode: latest
      cocoapods: default
    integrations:
      app_store_connect: ROYA ASC Key
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - $HOME/Library/Caches/CocoaPods
        - ios/Pods
    scripts:
      - name: فحص المفتاح قبل التوقيع
        script: |
          if [ -z "$CERTIFICATE_PRIVATE_KEY" ]; then
            echo "❌ المتغير CERTIFICATE_PRIVATE_KEY ما وصل البناء."
            echo "   تبويب Environment variables لتطبيق shater-app:"
            echo "   الاسم حرفيًا CERTIFICATE_PRIVATE_KEY · المجموعة حرفيًا appstore · اضغط Add"
            exit 1
          fi
          echo "✅ المفتاح موجود (${#CERTIFICATE_PRIVATE_KEY} حرفًا)"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Install CocoaPods
        script: find . -name "Podfile" -execdir pod install \;
      - name: Fetch or create signing files
        script: |
          keychain initialize
          app-store-connect fetch-signing-files "com.shater.app" \
            --type IOS_APP_STORE --create
          keychain add-certificates
      - name: Set up signing
        script: xcode-project use-profiles
      - name: Build IPA
        script: |
          flutter build ipa --release \
            --build-number=$PROJECT_BUILD_NUMBER \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # بلا إرسال لمراجعة خارجية — يوصل الاختبار الداخلي فورًا
        # (قرار رويا ٣١ يوليو: فارس يختبر بنفسه)
