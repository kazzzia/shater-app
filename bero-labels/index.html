<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#6a2a7c">
<title>محرّر ملصقات BERO</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

:root{
  --bg:#f3f1f4; --surface:#ffffff; --ink:#221a26; --muted:#6d6373; --line:#ddd6e0;
  --accent:#6a2a7c; --accent-ink:#ffffff; --accent-soft:#efe3f3; --warn:#a4470c; --warn-soft:#fdeedd; --ok:#1c6f45;
  --ui:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif; color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#17131a; --surface:#221c26; --ink:#f0eaf2; --muted:#a79daf; --line:#3a313f;
  --accent:#c9a0d8; --accent-ink:#21122a; --accent-soft:#33243b; --warn:#f0b27a; --warn-soft:#3b2a1c; --ok:#7fd3a6; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#17131a; --surface:#221c26; --ink:#f0eaf2; --muted:#a79daf; --line:#3a313f;
  --accent:#c9a0d8; --accent-ink:#21122a; --accent-soft:#33243b; --warn:#f0b27a; --warn-soft:#3b2a1c; --ok:#7fd3a6; color-scheme:dark }
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--ui);font-size:15px;line-height:1.6;direction:rtl;
  padding-inline:max(16px,env(safe-area-inset-left)) max(16px,env(safe-area-inset-right));padding-block:0 calc(48px + env(safe-area-inset-bottom))}
.wrap{max-width:1180px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding-block:calc(12px + env(safe-area-inset-top)) 10px;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;justify-content:space-between}
h1{font-size:19px;font-weight:600;margin:0;line-height:1.3}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface);max-width:100%}
.seg button{border:0;background:transparent;color:var(--ink);font:inherit;font-weight:500;padding:8px 14px;cursor:pointer;white-space:nowrap}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.status{font-size:13px;color:var(--muted);min-height:1.6em}
.status.ok{color:var(--ok)}.status.warn{color:var(--warn)}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
.left{display:flex;flex-direction:column;gap:12px;min-width:0}
@media (min-width:980px){.grid{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);align-items:start}.left{position:sticky;top:74px}}
.stage,.dlbox{display:flex;flex-direction:column;gap:10px;min-width:0}
.bar{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:center;justify-content:space-between}
.canvasBox{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px;overflow:hidden}
canvas#view{display:block;width:100%;height:auto;border-radius:6px;cursor:pointer;background:#fff;margin-inline:auto}
.hint{font-size:13px;color:var(--muted);margin:0}
.dl{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.dl span{font-size:13px;color:var(--muted)}
.btn{border:1px solid var(--line);background:var(--surface);color:var(--ink);font:inherit;font-weight:500;border-radius:10px;padding:8px 14px;cursor:pointer;min-height:40px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn:disabled{opacity:.55;cursor:default}
.fields{display:flex;flex-direction:column;gap:14px;min-width:0}
.group{font-size:13px;font-weight:600;color:var(--muted);margin:6px 0 -4px;letter-spacing:.02em}
.field{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.field.active{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.field .head{display:flex;align-items:center;justify-content:space-between;gap:8px 10px;flex-wrap:wrap}
.field label{font-weight:600}
.ctrls{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sz{display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--muted)}
.sz button,.bold{width:34px;height:34px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:16px;line-height:1;cursor:pointer}
.bold{font-weight:800;font-family:Arial,sans-serif}
.bold[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.sz output{min-width:3.2em;text-align:center;font-variant-numeric:tabular-nums;color:var(--ink)}
select{font:inherit;font-size:14px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:6px 8px;min-height:34px;max-width:100%}
.fontAll{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fontAll label{display:flex;flex-direction:column;gap:4px;font-size:13px;font-weight:600;color:var(--muted)}
textarea{width:100%;font:inherit;line-height:1.7;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;resize:vertical}
textarea[dir="ltr"]{text-align:left}
.over{font-size:13px;color:var(--warn);background:var(--warn-soft);border-radius:8px;padding:6px 10px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding-top:14px}
dialog{border:1px solid var(--line);border-radius:14px;background:var(--surface);color:var(--ink);padding:16px;max-width:min(92vw,560px)}
dialog::backdrop{background:rgba(20,10,25,.55)}
dialog img{display:block;max-width:100%;border:1px solid var(--line);border-radius:8px;margin-block:10px}
dialog .row{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* الجوال: المعاينة تبقى ظاهرة فوق الحقول وأنت تكتب */
@media (max-width:979px){
  header.top{position:static}
  h1{font-size:17px}
  .left{display:contents}
  .grid{gap:14px}
  .stage{order:1;position:sticky;top:0;z-index:4;background:var(--bg);margin-inline:-16px;padding:calc(8px + env(safe-area-inset-top)) 16px 8px;border-bottom:1px solid var(--line);gap:8px}
  .fields{order:2}
  .dlbox{order:3}
  .tapHint{display:none}
  .bar .seg button{padding:6px 12px;font-size:14px}
  .canvasBox{padding:4px}
  canvas#view{width:auto;max-width:100%;max-height:34vh;max-height:34svh}
  body:has(.fields textarea:focus) canvas#view{max-height:24vh;max-height:24svh}
  body:has(.fields textarea:focus) .stage .bar{display:none}
  textarea,select{font-size:16px} /* أقل من 16 يخلّي آيفون يكبّر الصفحة عند الكتابة */
  .field{scroll-margin-top:calc(26svh + 24px)}
}
@media (max-width:420px){ .fontAll{grid-template-columns:1fr} .seg button{padding:8px 11px} }
</style>
</head>

<div class="wrap">
  <header class="top">
    <h1>محرّر ملصقات BERO</h1>
    <div class="seg" role="group" aria-label="المنتج">
      <button type="button" id="tabTreatment" data-label="treatment" aria-pressed="true">Treatment</button>
      <button type="button" id="tabStraightener" data-label="straightener" aria-pressed="false">Hair Straightener</button>
    </div>
    <div class="status" id="status" role="status" aria-live="polite"></div>
  </header>

  <div class="grid">
    <div class="left">
      <section class="stage" aria-label="المعاينة">
        <div class="bar">
          <div class="seg" role="group" aria-label="الجزء المعروض">
            <button type="button" id="vAll" data-view="all" aria-pressed="true">الملصق كامل</button>
            <button type="button" id="vFront" data-view="front" aria-pressed="false">الواجهة</button>
            <button type="button" id="vBack" data-view="back" aria-pressed="false">الخلف</button>
          </div>
          <p class="hint" id="dims"></p>
        </div>
        <div class="canvasBox"><canvas id="view" width="1200" height="787"></canvas></div>
        <p class="hint tapHint">اضغط على أي نص في الملصق لتنتقل إلى حقله. الشعار والرسمة والباركود ثابتة.</p>
      </section>
      <section class="dlbox" aria-label="التنزيل">
        <div class="dl" id="dl">
          <span>تنزيل:</span>
          <button type="button" class="btn primary" id="dlPNG" data-fmt="png">PNG</button>
          <button type="button" class="btn" id="dlJPG" data-fmt="jpg">JPG</button>
          <button type="button" class="btn" id="dlPDF" data-fmt="pdf">PDF</button>
          <button type="button" class="btn" id="dlSVG" data-fmt="svg">SVG</button>
        </div>
        <p class="hint" id="dlNote">PNG و JPG و PDF بدقة 600 نقطة بالمقاس الحقيقي. SVG يحتفظ بالنص قابلًا للتعديل في Illustrator.</p>
      </section>
    </div>

    <section class="fields" id="fields" aria-label="النصوص"></section>
  </div>

  <div class="foot">
    <p class="hint" id="saveNote">التعديلات تُحفظ تلقائيًا.</p>
    <button type="button" class="btn" id="reset">رجّع نصوص هذا الملصق للأصل</button>
  </div>
</div>

<dialog id="dlg">
  <strong id="dlgT"></strong>
  <div id="dlgB"></div>
  <div class="row"><button type="button" class="btn" id="dlgNo">إغلاق</button><button type="button" class="btn primary" id="dlgYes" hidden>نعم، رجّعها</button></div>
</dialog>

function fullCanvas(S) { var L = LABELS[cur], c = document.createElement("canvas"); c.width = Math.round(L.w * S); c.height = Math.round(L.h * S); var x = c.getContext("2d");

$("dlgNo").addEventListener("click", function () { $("dlg").close(); });
[].forEach.call(document.querySelectorAll("#dl button"), function (btn) { btn.addEventListener("click", function () {
  var fmt = btn.dataset.fmt, old = btn.textContent; btn.disabled = true; btn.textContent = "يجهّز…";
  var done = function () { btn.disabled = false; btn.textContent = old; };
  document.fonts.ready.then(function () { return make(fmt); }).then(function (blob) {

  dialog("ترجّع نصوص الملصق للأصل؟", p, function () { state[cur] = defaults(cur); buildFields(); touch(); }); });

    db = d; $("saveNote").textContent = "التعديلات تُحفظ تلقائيًا ويراها كل من يفتح الصفحة.";
